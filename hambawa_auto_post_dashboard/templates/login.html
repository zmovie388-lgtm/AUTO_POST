<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAMBAWA Dashboard Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#12375b,#040915 70%);font:16px system-ui;color:#eef8ff;padding:20px}.box{width:min(410px,100%);padding:28px;border:1px solid #234663;border-radius:24px;background:#091629}.logo{font-size:32px}h1{margin:8px 0}p{color:#91a9c1}input,button{width:100%;padding:14px;border-radius:12px;font:inherit}input{background:#040d19;color:white;border:1px solid #29435e;margin:12px 0}button{border:0;background:linear-gradient(90deg,#36d8ed,#647dff);font-weight:800;color:#03111f}.err{color:#ff9db0;margin-top:12px}</style></head><body><form class="box" method="post"><div class="logo">⚡</div><small style="color:#4de2f3;letter-spacing:2px">HAMBAWA CONTROL CENTER</small><h1>Auto Post Dashboard</h1><p>Sign in to manage your Telegram bot.</p><input type="password" name="password" placeholder="Dashboard password" required><button>Unlock Dashboard →</button>{% if error %}<div class="err">{{ error }}</div>{% endif %}</form></body></html>
